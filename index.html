<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoArchive</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to a CSS file for styling -->
    <script src="script.js" defer></script> <!-- Link to a JS file for interactivity -->
</head>
<body>
    <header>
        <h1>ChronoArchive: Explore Historical Wonders</h1>
        <input type="text" id="searchBar" placeholder="Search for a country...">
    </header>
    
    <main id="countryList">
        <div class="country" id="country1">
            <h2>Italy</h2>
            <p>Explore Italy's rich history with artifacts and museums.</p>
            <button onclick="openModal('italyModal')">More Info</button>
        </div>
        <div class="country" id="country2">
            <h2>Egypt</h2>
            <p>Discover the ancient civilization of Egypt.</p>
            <button onclick="openModal('egyptModal')">More Info</button>
        </div>
        <!-- Add more countries as needed -->
    </main>

    <!-- Modal Structure -->
    <div class="modal" id="italyModal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="closeModal('italyModal')">&times;</span>
            <h2>Italy</h2>
            <p>Detailed historical data about Italy...</p>
        </div>
    </div>
    <div class="modal" id="egyptModal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="closeModal('egyptModal')">&times;</span>
            <h2>Egypt</h2>
            <p>Detailed historical data about Egypt...</p>
        </div>
    </div>

    <footer>
        <p>ChronoArchive &copy; 2026</p>
    </footer>
</body>
</html>
